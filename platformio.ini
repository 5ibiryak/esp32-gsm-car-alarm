; LILYGO T-SIM7600G-H / T-SIM7600E-H smart car alarm firmware
; Target board: ESP32-WROVER on LILYGO T-SIM7600G-H

[env:t-sim7600]
platform = espressif32
board = esp32dev
framework = arduino

; OTA-capable partition layout (two app slots + spiffs). The web upload
; in OtaManager writes to the inactive ota_X slot, then ESP.restart()
; boots the new image.
board_build.partitions = partitions_ota.csv

monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/cu.usbserial-5B1F0007551
monitor_port = /dev/cu.usbserial-5B1F0007551
; monitor_filters = time, esp32_exception_decoder

build_flags =
    ; PSRAM is on the WROVER module — keep it enabled
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; Identify the LILYGO board variant for code that conditionally compiles
    -DLILYGO_T_SIM7600
    ; TinyGSM modem selection — used in Phase 7
    -DTINY_GSM_MODEM_SIM7600
    -DTINY_GSM_RX_BUFFER=1024

lib_deps =
    vshymanskyy/TinyGSM
